{% extends "base.html" %}
{% block title %}Room Settings - The Last Apartment{% endblock %}
{% block content %}
<div class="nav">
  <a href="/">the room</a>
  <a href="/journal">memories</a>
  <a class="active" href="/config">settings</a>
  <a href="/calibrate">calibrate</a>
</div>
<label>your name (ERIN will remember)</label>
<input type="text" id="player-name" placeholder="visitor" value="{{ config.get('player_name', 'friend') }}">
<div class="sec">Room Settings</div>
<div class="grid">
  <div><label>RS</label><input type="number" id="pin_RS" value="{{ config.pin_map.RS }}"></div>
  <div><label>RW</label><input type="number" id="pin_RW" value="{{ config.pin_map.RW }}"></div>
  <div><label>E (Enable)</label><input type="number" id="pin_E" value="{{ config.pin_map.E }}"></div>
  <div><label>Backlight (LOW=ON)</label><input type="number" id="pin_BACKLIGHT" value="{{ config.pin_map.BACKLIGHT }}"></div>
  <div><label>D4</label><input type="number" id="pin_D4" value="{{ config.pin_map.D4 }}"></div>
  <div><label>D5</label><input type="number" id="pin_D5" value="{{ config.pin_map.D5 }}"></div>
  <div><label>D6</label><input type="number" id="pin_D6" value="{{ config.pin_map.D6 }}"></div>
  <div><label>D7</label><input type="number" id="pin_D7" value="{{ config.pin_map.D7 }}"></div>
  <div><label>Touch Sensor</label><input type="number" id="pin_TOUCH" value="{{ config.pin_map.TOUCH }}"></div>
  <div><label>Feedback LED</label><input type="number" id="pin_LED" value="{{ config.pin_map.get('LED', '') }}"></div>
  <div><label>Buzzer</label><input type="number" id="pin_BUZZER" value="{{ config.pin_map.get('BUZZER', '') }}"></div>
</div>
<div class="grid" style="margin-top:8px;">
  <div><label>LCD Columns</label><input type="number" id="cols" value="{{ config.get('cols', 16) }}"></div>
  <div><label>LCD Rows</label><input type="number" id="rows" value="{{ config.get('rows', 2) }}"></div>
</div>
<button onclick="saveConfig()">save settings</button>
<div class="sec">Emergency</div>
<button class="dng" onclick="emergencyReset()">close the door and leave the light on</button>
<p class="ht">stops everything, clears the screen</p>
<div class="st" id="status"></div>
<script>
  function setStatus(m, c) { const s = document.getElementById('status'); s.textContent = m; s.className = 'st ' + (c||''); }
  async function saveConfig() {
    const keys = ['RS','RW','E','BACKLIGHT','D4','D5','D6','D7','TOUCH','LED','BUZZER'];
    const pm = {};
    keys.forEach(k => { const v = document.getElementById('pin_'+k).value.trim(); pm[k] = v === '' ? null : parseInt(v); });
    const body = { player_name: document.getElementById('player-name').value.trim() || 'friend', pin_map: pm,
      cols: parseInt(document.getElementById('cols').value), rows: parseInt(document.getElementById('rows').value) };
    setStatus('saving...', '');
    try { const r = await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      const j = await r.json(); if (j.ok) setStatus('saved', 'ok'); else setStatus('error', 'er');
    } catch(e) { setStatus(e.message, 'er'); }
  }
  async function emergencyReset() {
    if (!confirm('Close the door and leave the light on for me?')) return;
    try { await fetch('/api/emergency', {method:'POST'}); setStatus('done', 'ok'); } catch(e) { setStatus(e.message, 'er'); }
  }
</script>
{% endblock %}
