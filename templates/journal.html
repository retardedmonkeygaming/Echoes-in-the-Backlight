{% extends "base.html" %}
{% block title %}Soul Journal — Echoes{% endblock %}

{% block content %}
<div class="nav">
  <a href="/">game</a>
  <a class="active" href="/journal">journal</a>
  <a href="/config">config</a>
  <a href="/calibrate">calibrate</a>
</div>

<div class="sec" style="margin-top:0;">Soul Journal</div>
<p class="ht" style="margin-bottom:16px;">
  Every word you've spoken. Every echo it answered.
</p>

<!-- Search -->
<label>Search memories</label>
<div style="display:flex; gap:6px;">
  <input type="text" id="search-q" placeholder="find an old echo..." style="flex:1;">
  <button class="sec" onclick="searchMemory()" style="flex:none; width:80px; margin-top:0;">Search</button>
</div>

<!-- Actions -->
<div style="display:flex; gap:6px; margin-top:12px;">
  <button class="sec" onclick="loadRecent()" style="flex:1; margin-top:0;">Recent</button>
  <button class="sec" onclick="loadAll()" style="flex:1; margin-top:0;">All</button>
  <button class="sec" onclick="loadCapsule()" style="flex:1; margin-top:0;">Time Capsule</button>
  <button class="sec" onclick="exportAll()" style="flex:1; margin-top:0;">Export</button>
</div>

<!-- Entry count -->
<div class="st" id="entry-count" style="margin-top:8px;">loading...</div>

<!-- Memory list -->
<div id="memory-list" style="margin-top:12px;"></div>

<!-- Time Capsule viewer -->
<div id="capsule-view" style="display:none; margin-top:12px; padding:12px; background:var(--sf); border:1px solid var(--bd); border-radius:3px;">
  <div style="font-size:10px; text-transform:uppercase; letter-spacing:2px; color:var(--dm); margin-bottom:8px;">Time Capsule</div>
  <div id="capsule-content"></div>
  <div style="display:flex; gap:6px; margin-top:8px;">
    <button class="sec" onclick="capsulePrev()" style="flex:1; margin-top:0;">← Older</button>
    <button class="sec" onclick="capsuleNext()" style="flex:1; margin-top:0;">Newer →</button>
  </div>
</div>

<script>
  let capsuleSlot = 0;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadRecent() {
    hideCapsule();
    const list = document.getElementById('memory-list');
    list.innerHTML = '<div class="st">loading...</div>';
    try {
      const r = await fetch('/api/journal/recent?n=20');
      const j = await r.json();
      renderEntries(j.entries);
    } catch(e) {
      list.innerHTML = '<div class="st er">error: ' + e.message + '</div>';
    }
  }

  async function loadAll() {
    hideCapsule();
    const list = document.getElementById('memory-list');
    list.innerHTML = '<div class="st">loading...</div>';
    try {
      const r = await fetch('/api/journal/recent?n=200');
      const j = await r.json();
      renderEntries(j.entries);
    } catch(e) {
      list.innerHTML = '<div class="st er">error: ' + e.message + '</div>';
    }
  }

  async function searchMemory() {
    const q = document.getElementById('search-q').value.trim();
    if (!q) return loadRecent();
    hideCapsule();
    const list = document.getElementById('memory-list');
    list.innerHTML = '<div class="st">searching...</div>';
    try {
      const r = await fetch('/api/journal/search?q=' + encodeURIComponent(q));
      const j = await r.json();
      renderEntries(j.entries);
    } catch(e) {
      list.innerHTML = '<div class="st er">error: ' + e.message + '</div>';
    }
  }

  function renderEntries(entries) {
    const list = document.getElementById('memory-list');
    const countEl = document.getElementById('entry-count');
    if (!entries || entries.length === 0) {
      list.innerHTML = '<div class="st">no memories yet — speak to Echo</div>';
      countEl.textContent = '0 entries';
      return;
    }
    countEl.textContent = entries.length + ' entries';
    let html = '';
    for (const entry of entries) {
      const role = entry.role === 'player' ? 'YOU' : 'ECHO';
      const color = entry.role === 'player' ? 'var(--tx)' : 'var(--ac)';
      const ts = entry.timestamp ? entry.timestamp.split('T')[1] || '' : '';
      html += '<div style="padding:10px 12px; margin-bottom:4px; background:var(--sf); border:1px solid var(--bd); border-radius:3px;">';
      html += '<span style="color:var(--dm); font-size:9px;">[' + escapeHtml(ts) + ']</span> ';
      html += '<span style="color:var(--dm); font-size:10px;">' + role + ':</span> ';
      html += '<span style="color:' + color + '; font-size:12px;">' + escapeHtml(entry.text) + '</span>';
      html += '</div>';
    }
    list.innerHTML = html;
  }

  // ── Time Capsule ────────────────────────────────────────────
  async function loadCapsule() {
    capsuleSlot = 0;
    document.getElementById('memory-list').innerHTML = '';
    document.getElementById('capsule-view').style.display = 'block';
    await fetchCapsule();
  }

  function hideCapsule() {
    document.getElementById('capsule-view').style.display = 'none';
  }

  async function fetchCapsule() {
    const content = document.getElementById('capsule-content');
    content.innerHTML = '<div style="color:var(--dm); font-size:11px;">loading capsule...</div>';
    try {
      const r = await fetch('/api/capsule/' + capsuleSlot);
      if (!r.ok) {
        content.innerHTML = '<div style="color:var(--dm); font-size:11px;">no memory at slot ' + capsuleSlot + '</div>';
        return;
      }
      const j = await r.json();
      let html = '<div style="font-size:9px; color:var(--dm); margin-bottom:6px;">Slot ' + j.slot + ' of ' + j.total_slots + '</div>';
      for (const e of j.entries) {
        const role = e.role === 'player' ? 'YOU' : 'ECHO';
        const color = e.role === 'player' ? 'var(--tx)' : 'var(--ac)';
        html += '<div style="margin-top:6px; font-size:12px;"><span style="color:var(--dm); font-size:10px;">' + role + ':</span> <span style="color:' + color + ';">' + escapeHtml(e.text) + '</span></div>';
      }
      content.innerHTML = html;
    } catch(e) {
      content.innerHTML = '<div style="color:var(--dg); font-size:11px;">error loading capsule</div>';
    }
  }

  function capsulePrev() {
    if (capsuleSlot > 0) { capsuleSlot--; fetchCapsule(); }
  }

  function capsuleNext() {
    capsuleSlot++;
    fetchCapsule();
  }

  function exportAll() {
    window.open('/api/journal/export', '_blank');
  }

  // load on start
  loadRecent();
</script>
{% endblock %}
