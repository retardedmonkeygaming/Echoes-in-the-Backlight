{% extends "base.html" %}
{% block title %}Soul Journal — Echoes{% endblock %}

{% block content %}
<div class="nav">
  <a href="/">game</a>
  <a class="active" href="/journal">journal</a>
  <a href="/config">config</a>
</div>

<div class="section-title" style="margin-top:0;">Soul Journal</div>
<p style="font-size:11px; color:var(--dim); text-align:center; margin-bottom:16px;">
  Every word you've spoken. Every echo it answered.<br>
  Lock a memory to make it permanent. The AI will remember it forever.
</p>

<!-- Search -->
<label>Search memories</label>
<div style="display:flex; gap:6px;">
  <input type="text" id="search-q" placeholder="find an old echo..." style="flex:1;">
  <button class="secondary" onclick="searchMemory()" style="flex:none; width:80px; margin-top:0;">Search</button>
</div>

<!-- Actions -->
<div style="display:flex; gap:6px; margin-top:12px;">
  <button class="secondary" onclick="loadRecent()" style="flex:1; margin-top:0;">Recent</button>
  <button class="secondary" onclick="loadAll()" style="flex:1; margin-top:0;">All Slots</button>
  <button class="secondary" onclick="exportAll()" style="flex:1; margin-top:0;">Export</button>
</div>

<!-- Memory list -->
<div id="memory-list" style="margin-top:16px;">
  <div class="status">loading...</div>
</div>

<script>
  async function loadRecent() {
    const list = document.getElementById('memory-list');
    list.innerHTML = '<div class="status">loading...</div>';
    try {
      const r = await fetch('/api/memory/recent?n=20');
      const j = await r.json();
      renderMemories(j.memories);
    } catch(e) {
      list.innerHTML = '<div class="status err">error: ' + e.message + '</div>';
    }
  }

  async function loadAll() {
    const list = document.getElementById('memory-list');
    list.innerHTML = '<div class="status">loading...</div>';
    try {
      const r = await fetch('/api/memory/recent?n=100');
      const j = await r.json();
      renderMemories(j.memories);
    } catch(e) {
      list.innerHTML = '<div class="status err">error: ' + e.message + '</div>';
    }
  }

  async function searchMemory() {
    const q = document.getElementById('search-q').value.trim();
    if (!q) return loadRecent();
    const list = document.getElementById('memory-list');
    list.innerHTML = '<div class="status">searching...</div>';
    try {
      const r = await fetch('/api/memory/search?q=' + encodeURIComponent(q));
      const j = await r.json();
      renderMemories(j.memories);
    } catch(e) {
      list.innerHTML = '<div class="status err">error: ' + e.message + '</div>';
    }
  }

  function renderMemories(memories) {
    const list = document.getElementById('memory-list');
    if (!memories || memories.length === 0) {
      list.innerHTML = '<div class="status">no memories found</div>';
      return;
    }
    let html = '';
    for (const mem of memories) {
      const slot = mem.slot;
      const isLocked = mem.entries.some(e => e.locked);
      const lockIcon = isLocked ? ' 🔒' : '';
      html += '<div class="journal-slot" style="margin-bottom:12px; padding:10px; background:var(--surface); border:1px solid ' + (isLocked ? 'var(--ok)' : 'var(--border)') + '; border-radius:3px;">';
      html += '<div style="display:flex; justify-content:space-between; align-items:center;">';
      html += '<span style="font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:1px;">Slot ' + slot + lockIcon + '</span>';
      html += '<button class="secondary" onclick="toggleLock(' + slot + ')" style="width:auto; padding:4px 10px; margin:0; font-size:9px;">' + (isLocked ? 'Unlock' : 'Lock') + '</button>';
      html += '</div>';
      for (const entry of mem.entries) {
        const role = entry.role === 'player' ? 'YOU' : 'ECHO';
        const color = entry.role === 'player' ? 'var(--text)' : 'var(--accent)';
        const ts = entry.created_at ? entry.created_at.split('T')[1] || '' : '';
        html += '<div style="margin-top:8px; font-size:12px;">';
        html += '<span style="color:var(--dim); font-size:9px;">[' + ts + ']</span> ';
        html += '<span style="color:var(--dim); font-size:10px;">' + role + ':</span> ';
        html += '<span style="color:' + color + ';">' + escapeHtml(entry.text) + '</span>';
        html += '</div>';
      }
      html += '</div>';
    }
    list.innerHTML = html;
  }

  async function toggleLock(slot) {
    try {
      const r = await fetch('/api/memory/lock', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({slot: slot})
      });
      const j = await r.json();
      // reload current view
      loadRecent();
    } catch(e) {}
  }

  function exportAll() {
    window.open('/api/memory/export', '_blank');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // load on start
  loadRecent();
</script>
{% endblock %}
