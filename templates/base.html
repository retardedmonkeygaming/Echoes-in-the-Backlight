<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>{% block title %}Echoes in the Backlight{% endblock %}</title>
  <style>
    :root {
      --bg: #07070c; --sf: #0e0e18; --bd: #1e1e2e;
      --tx: #b8b8c8; --dm: #5a5a6a; --ac: #4a8aaa; --gw: #2a6a8a;
      --dg: #8a3a3a; --ok: #3a8a5a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      font-family: 'Courier New', monospace;
      background: var(--bg); color: var(--tx);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    .pg { max-width:500px; margin:0 auto; padding:20px 16px 60px; }
    .tt {
      font-size:10px; text-transform:uppercase; letter-spacing:4px;
      color:var(--dm); text-align:center; padding:16px 0 8px;
      border-bottom:1px solid var(--bd); margin-bottom:20px;
    }
    /* ── Navigation ── */
    .nav {
      display:flex; justify-content:center; gap:20px;
      font-size:11px; text-transform:uppercase; letter-spacing:2px;
      margin-bottom:20px;
    }
    .nav a {
      color:var(--dm); text-decoration:none; padding:4px 0;
      border-bottom:1px solid transparent; transition: all .2s;
    }
    .nav a:hover, .nav a.active {
      color:var(--ac); border-bottom-color:var(--gw);
    }
    /* ── Forms ── */
    label {
      display:block; font-size:10px; text-transform:uppercase;
      letter-spacing:1.5px; color:var(--dm); margin-bottom:4px; margin-top:14px;
    }
    input[type="text"], input[type="number"], input[type="password"] {
      width:100%; padding:10px 12px; background:var(--sf);
      border:1px solid var(--bd); border-radius:3px;
      color:var(--tx); font-family:inherit; font-size:14px;
      outline:none; transition: border-color .2s;
    }
    input:focus { border-color:var(--gw); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    /* ── Buttons ── */
    button {
      width:100%; padding:12px; margin-top:12px;
      background:var(--gw); border:none; border-radius:3px;
      color:#fff; font-family:inherit; font-size:11px;
      text-transform:uppercase; letter-spacing:2px;
      cursor:pointer; transition: opacity .15s;
    }
    button:active { opacity:.6; }
    button.sec { background:transparent; border:1px solid var(--bd); color:var(--dm); }
    button.dng { background:var(--dg); }
    button.sm { padding:8px; font-size:10px; margin-top:8px; }
    /* ── Status ── */
    .st {
      margin-top:12px; padding:10px; background:var(--sf);
      border:1px solid var(--bd); border-radius:3px;
      font-size:11px; color:var(--dm); text-align:center; word-break:break-word;
    }
    .st.ok { color:var(--ok); border-color:var(--ok); }
    .st.er { color:var(--dg); border-color:var(--dg); }
    /* ── Section titles ── */
    .sec {
      font-size:10px; text-transform:uppercase; letter-spacing:3px;
      color:var(--dm); margin-top:28px; margin-bottom:10px;
      padding-bottom:4px; border-bottom:1px solid var(--bd);
    }
    /* ── Hint text ── */
    .ht { font-size:10px; color:var(--dm); text-align:center; margin-top:8px; }
    /* ── LCD Preview ── */
    .lcd-box {
      background:#1a1a0a; border:2px solid #3a3a2a; border-radius:4px;
      padding:8px 12px; font-size:13px; color:#7a9a3a;
      font-family:'Courier New',monospace; letter-spacing:1px;
      margin-top:10px; line-height:1.6; min-height:42px;
      text-shadow: 0 0 4px #7a9a3a44;
    }
  </style>
</head>
<body>
<div class="pg">
  <div class="tt">Echoes in the Backlight</div>
  {% block content %}{% endblock %}
</div>
</body>
</html>
